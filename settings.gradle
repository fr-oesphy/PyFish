pluginManagement {
    def profileId = providers.gradleProperty('pyfishVersionProfile')
            .orElse(providers.gradleProperty('default_version_profile')).getOrElse('mc1211')
    def profiles = new groovy.json.JsonSlurper().parse(file('gradle/version-profiles.json'))
    def toolVersions = profiles[profileId] ?: [:]
    resolutionStrategy {
        eachPlugin {
            def field = [
                    'net.fabricmc.fabric-loom-remap': 'fabric_loom_version',
                    'net.neoforged.moddev': 'moddev_version',
                    'com.gradleup.shadow': 'shadow_version'
            ][requested.id.id]
            if (field && toolVersions[field]) {
                useVersion(toolVersions[field])
            }
        }
    }
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
                includeGroup('fabric-loom')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = uri('https://repo.spongepowered.org/repository/maven-public')
                }
            }
            filter {
                includeGroupAndSubgroups('org.spongepowered')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'pyfish-1.21.1'

def skipFabric = (gradle.startParameter.projectProperties['pyfishSkipFabric'] ?: 'false').toBoolean()
def skipNeoForge = (gradle.startParameter.projectProperties['pyfishSkipNeoForge'] ?: 'false').toBoolean()

include('common')

if (!skipFabric) {
    include('fabric')
}

if (!skipNeoForge) {
    include('neoforge')
}
