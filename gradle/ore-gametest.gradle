// Test code and fixtures are deliberately kept out of the published mod.
if (providers.gradleProperty('pyfishGameTests').isPresent()) {
    def structureDataVersions = [mc1211: 3955, mc12111: 4671, mc262: 4903]
    if (!structureDataVersions.containsKey(pyfish_version_profile_id)) {
        throw new GradleException('Ore GameTests support the mc1211, mc12111 and mc262 profiles.')
    }
    // These profiles share the GameTest registration API, but not the structure data version.
    def fixtureProfile = pyfish_version_profile_id in ['mc12111', 'mc262'] ? 'mc12111_mc262' : pyfish_version_profile_id
    sourceSets {
        gametest {
            java.srcDir(rootProject.file('common/src/gameTest/java'))
            java.srcDir(rootProject.file("common/src/gameTest/${fixtureProfile}/java"))
            java.srcDir(project.file("src/gameTest/${fixtureProfile}/java"))
            resources.setSrcDirs([
                    rootProject.file('common/src/gameTest/resources'),
                    rootProject.file("common/src/gameTest/${fixtureProfile}/resources"),
                    project.file('src/gameTest/resources'),
                    project.file("src/gameTest/${fixtureProfile}/resources")
            ])
            resources.exclude('pyfish/**')
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    configurations.gametestImplementation.extendsFrom(configurations.implementation)
    configurations.gametestRuntimeOnly.extendsFrom(configurations.runtimeOnly)

    def emptyStructure = tasks.register('generateOreTestStructure') {
        def output = layout.buildDirectory.dir('generated/oreGameTestResources')
        inputs.property('dataVersion', structureDataVersions[pyfish_version_profile_id])
        outputs.dir(output)
        doLast {
            def file = output.get().file('data/pyfish_ore_tests/structure/empty.nbt').asFile
            file.parentFile.mkdirs()
            // A one-block empty template; the test creates its own controlled terrain.
            file.withOutputStream { raw ->
                def stream = new DataOutputStream(new java.util.zip.GZIPOutputStream(raw))
                stream.writeByte(10)
                stream.writeUTF('')
                stream.writeByte(3)
                stream.writeUTF('DataVersion')
                stream.writeInt(structureDataVersions[pyfish_version_profile_id])
                stream.writeByte(9)
                stream.writeUTF('size')
                stream.writeByte(3)
                stream.writeInt(3)
                3.times { stream.writeInt(1) }
                ['entities', 'blocks', 'palette'].each { name ->
                    stream.writeByte(9)
                    stream.writeUTF(name)
                    stream.writeByte(10)
                    stream.writeInt(0)
                }
                stream.writeByte(0)
                stream.close()
            }
        }
    }
    sourceSets.gametest.resources.srcDir(emptyStructure)
    tasks.named('processGametestResources') {
        doFirst { delete(layout.buildDirectory.dir('resources/gametest/pyfish')) }
    }

    tasks.matching { it.name in ['runGameTest', 'runGameTestServer'] }.configureEach {
        doFirst {
            // Fresh chunks are essential: old region files could hide a broken generator.
            ['world', 'gametestworld', 'gametestserver'].each { name ->
                delete(project.file("runs/ore-tests-${pyfish_version_profile_id}/${name}"))
            }
            // External scripts exercise the same public path on both loaders, including
            // FML versions that do not expose another mod's classpath resource directories.
            copy {
                from(rootProject.file('common/src/gameTest/resources/pyfish'))
                into(project.file("runs/ore-tests-${pyfish_version_profile_id}/pyfish"))
            }
        }
    }
}
