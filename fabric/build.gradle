plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom-remap'
    id 'com.gradleup.shadow'
}

configurations {
    embed
    implementation.extendsFrom(embed)
}

if (providers.gradleProperty('pyfishGameTests').isPresent()) {
    fabricApi.configureTests {
        createSourceSet = true
        modId = 'pyfish_ore_tests'
        enableClientGameTests = false
        eula = true
    }
    loom.runs.gameTest {
        runDir("runs/ore-tests-${pyfish_version_profile_id}")
        vmArg '-Djava.awt.headless=true'
    }
}

apply from: rootProject.file('gradle/ore-gametest.gradle')

configurations.configureEach {
    resolutionStrategy.componentSelection {
        all { selection ->
            if (selection.candidate.group == 'net.fabricmc.fabric-api'
                    && selection.candidate.module == 'fabric-api'
                    && !selection.candidate.version.endsWith(fabric_api_minecraft_suffix)) {
                selection.reject("Fabric API ${selection.candidate.version} does not target Minecraft ${minecraft_version}")
            }
        }
    }
}

sourceSets {
    main {
        java {
            def fabricVersionedSrcDir = null
            def fabricMainRuntimePackFile = file('src/main/java/fr/oesphy/pyfish/fabric/content/PyFishFabricRuntimePackResources.java').canonicalFile
            if (pyfish_version_profile_id == 'mc1211') {
                fabricVersionedSrcDir = 'src/mc1211/java'
            } else if (pyfish_version_profile_id in ['mc1212', 'mc1213']) {
                fabricVersionedSrcDir = 'src/mc1212/java'
            } else if (pyfish_version_profile_id == 'mc12111') {
                fabricVersionedSrcDir = 'src/mc12111/java'
            }
            if (fabricVersionedSrcDir != null) {
                srcDir fabricVersionedSrcDir
                exclude { details -> details.file.canonicalFile == fabricMainRuntimePackFile }
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_selector}"
    implementation("org.xerial:sqlite-jdbc:${rootProject.ext.pyfishSqliteJdbcVersion}") {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    include "org.xerial:sqlite-jdbc:${rootProject.ext.pyfishSqliteJdbcVersion}"

    rootProject.ext.pyfishCompileOnlyLibraries.each {
        compileOnly it
    }
    rootProject.ext.pyfishEmbeddedLibraries.each {
        embed it
    }
}

loom {
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

shadowJar {
    archiveClassifier = 'dev-shadow'
    configurations = [project.configurations.embed]
    mergeServiceFiles()

    manifest {
        attributes 'Multi-Release': true
    }

    exclude 'META-INF/native-image/**'
    exclude 'META-INF/native/**'
    exclude 'META-INF/proguard/**'
    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
    exclude 'META-INF/LICENSE*', 'META-INF/DEPENDENCIES', 'META-INF/NOTICE*'
    // Loom owns the nested driver; never expose a second copy from PyFish's main module.
    exclude 'org/sqlite/**'
    exclude 'META-INF/versions/*/org/sqlite/**'
    exclude 'META-INF/maven/org.xerial/sqlite-jdbc/**'
    exclude 'META-INF/services/java.sql.Driver'
    exclude '**/*.bat'
    exclude '**/*.exe'
    exclude 'org/slf4j/**'

    zip64 = true
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
    archiveClassifier = 'dev'
}

remapJar {
    dependsOn shadowJar
    inputFile.set(shadowJar.archiveFile)
    archiveClassifier = ''
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

remapSourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

def verifyPyFishRuntimeJar = tasks.register('verifyPyFishRuntimeJar') {
    dependsOn remapJar
    inputs.file(remapJar.archiveFile)

    doLast {
        def jarFile = remapJar.archiveFile.get().asFile
        def requiredEntries = [
                'org.graalvm.python.vfs/fileslist.txt',
                'pyfish.py',
                'java_asyncio.py',
                'java_logging.py',
                'java_multiprocessing.py',
                'java_pathlib.py',
                'java_pillow.py',
                'java_pyperclip.py',
                'java_requests.py',
                'java_sqlite3.py',
                'java_subprocess.py',
                'java_uuid.py',
                'java_websocket.py',
                'pip.whl'
        ]
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            def missingEntries = requiredEntries.findAll { entryName -> zip.getEntry(entryName) == null }
            if (!missingEntries.isEmpty()) {
                throw new GradleException("PyFish Fabric jar is missing runtime entries: ${missingEntries.join(', ')}")
            }
            def manifestEntry = zip.getEntry('META-INF/MANIFEST.MF')
            def manifest = manifestEntry != null
                    ? new java.util.jar.Manifest(zip.getInputStream(manifestEntry))
                    : null
            if (!manifest?.mainAttributes?.getValue('Multi-Release')?.equalsIgnoreCase('true')) {
                throw new GradleException('PyFish Fabric jar must preserve Multi-Release: true.')
            }

            def entries = java.util.Collections.list(zip.entries())
            if (entries.any { entry ->
                entry.name.endsWith('.class')
                        && (entry.name.startsWith('org/sqlite/')
                        || entry.name.matches('META-INF/versions/\\d+/org/sqlite/.*'))
            }) {
                throw new GradleException('PyFish Fabric jar exposes SQLite classes from its main module.')
            }
            def nestedSqlite = entries.find { entry ->
                entry.name.startsWith('META-INF/jars/')
                        && entry.name.contains('sqlite-jdbc')
                        && entry.name.endsWith('.jar')
            }
            if (nestedSqlite == null) {
                throw new GradleException('PyFish Fabric jar is missing the nested SQLite JDBC driver.')
            }
            def nestedZip = new java.util.zip.ZipInputStream(zip.getInputStream(nestedSqlite))
            try {
                def containsDriver = false
                def nestedEntry
                while ((nestedEntry = nestedZip.nextEntry) != null) {
                    if (nestedEntry.name == 'org/sqlite/JDBC.class') {
                        containsDriver = true
                        break
                    }
                }
                if (!containsDriver) {
                    throw new GradleException('PyFish Fabric nested SQLite jar is missing org.sqlite.JDBC.')
                }
            } finally {
                nestedZip.close()
            }
        } finally {
            zip.close()
        }
    }
}

def smokeTestPyFishRuntimeJar = tasks.register('smokeTestPyFishRuntimeJar', JavaExec) {
    dependsOn verifyPyFishRuntimeJar, project(':common').tasks.named('testClasses')
    mainClass = 'fr.oesphy.pyfish.runtime.GraalPyRuntimeJarSmokeTest'
    classpath = files(project(':common').sourceSets.test.output.classesDirs, remapJar.archiveFile)
    doFirst {
        delete(layout.buildDirectory.dir('tmp/graalpy-runtime-smoke'))
        args remapJar.archiveFile.get().asFile.absolutePath,
                layout.buildDirectory.dir('tmp/graalpy-runtime-smoke').get().asFile.absolutePath
    }
}

build.dependsOn smokeTestPyFishRuntimeJar

build.dependsOn remapJar, verifyPyFishRuntimeJar
