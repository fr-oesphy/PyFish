plugins {
    id 'multiloader-loader'
    id 'com.gradleup.shadow'
}

apply plugin: minecraft_obfuscated ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'

configurations {
    embed
    implementation.extendsFrom(embed)
}

if (providers.gradleProperty('pyfishGameTests').isPresent()) {
    fabricApi.configureTests {
        createSourceSet = true
        modId = 'pyfish_ore_tests'
        enableClientGameTests = false
        eula = true
    }
    loom.runs.gameTest {
        runDir("runs/ore-tests-${pyfish_version_profile_id}")
        vmArg '-Djava.awt.headless=true'
    }
}

apply from: rootProject.file('gradle/ore-gametest.gradle')

configurations.configureEach {
    resolutionStrategy.componentSelection {
        all { selection ->
            if (selection.candidate.group == 'net.fabricmc.fabric-api'
                    && selection.candidate.module == 'fabric-api'
                    && !selection.candidate.version.endsWith(fabric_api_minecraft_suffix)) {
                selection.reject("Fabric API ${selection.candidate.version} does not target Minecraft ${minecraft_version}")
            }
        }
    }
}

sourceSets {
    main {
        java {
            if (pyfish_version_profile_id != 'mc262') {
                srcDir(pyfish_version_profile_id in ['mc1211', 'mc1212', 'mc1213', 'mc1214', 'mc1215']
                        ? 'src/shared/mc1211-mc1215/java' : 'src/shared/mc1216-mc12111/java')
            }
            def fabricVersionedSrcDir = null
            def fabricMainRuntimePackFile = file('src/main/java/fr/oesphy/pyfish/fabric/content/PyFishFabricRuntimePackResources.java').canonicalFile
            if (pyfish_version_profile_id == 'mc1211') {
                fabricVersionedSrcDir = 'src/mc1211/java'
            } else if (pyfish_version_profile_id in ['mc1212', 'mc1213']) {
                fabricVersionedSrcDir = 'src/shared/mc1212-mc1213/java'
            } else if (pyfish_version_profile_id in ['mc12111', 'mc262']) {
                fabricVersionedSrcDir = 'src/shared/mc12111_mc262/java'
            }
            if (fabricVersionedSrcDir != null) {
                srcDir fabricVersionedSrcDir
                exclude { details -> details.file.canonicalFile == fabricMainRuntimePackFile }
            }
            if (pyfish_version_profile_id == 'mc262') {
                srcDir 'src/mc262/java'
                def overlay = file('src/mc262/java').canonicalFile
                exclude { details ->
                    !details.file.canonicalPath.startsWith(overlay.path + File.separator) &&
                            new File(overlay, details.relativePath.pathString).isFile()
                }
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    if (minecraft_obfuscated) {
        mappings loom.layered {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
        }
        modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_selector}"
    } else {
        implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_selector}"
    }

    rootProject.ext.pyfishCompileOnlyLibraries.each {
        compileOnly it
    }
    rootProject.ext.pyfishEmbeddedLibraries.each {
        embed it
    }
}

loom {
    if (minecraft_obfuscated) {
        mixin {
            defaultRefmapName.set("${mod_id}.refmap.json")
        }
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

if (providers.gradleProperty('pyfishClipboardClientTest').isPresent()) {
    if (pyfish_version_profile_id != 'mc262') {
        throw new GradleException('The clipboard client diagnostic currently targets mc262.')
    }
    sourceSets {
        clipboardTest {
            java.srcDir('src/clipboardTest/java')
            resources.setSrcDirs([file('src/clipboardTest/resources')])
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    configurations.clipboardTestImplementation.extendsFrom(configurations.implementation)
    configurations.clipboardTestRuntimeOnly.extendsFrom(configurations.runtimeOnly)
    loom.mods {
        pyfish { sourceSet sourceSets.main }
        pyfish_clipboard_probe { sourceSet sourceSets.clipboardTest }
    }
    loom.runs {
        clipboardClient {
            client()
            source sourceSets.clipboardTest
            runDir('runs/clipboard-test-mc262')
            vmArg '-Djava.awt.headless=false'
            programArg '--username'
            programArg 'ClipboardTest'
        }
    }
    tasks.named('runClipboardClient') {
        doFirst {
            def scripts = file('runs/clipboard-test-mc262/pyfish/clipboard_probe/scripts')
            scripts.mkdirs()
            new File(scripts.parentFile, 'requirements.txt').setText('pyperclip==1.11.0\n', 'UTF-8')
            new File(scripts, 'main.py').setText('import pyperclip\n', 'UTF-8')
        }
    }
}

shadowJar {
    archiveClassifier = 'dev-shadow'
    configurations = [project.configurations.embed]
    mergeServiceFiles()

    manifest {
        attributes 'Multi-Release': true
    }

    exclude 'META-INF/native-image/**'
    exclude 'META-INF/native/**'
    exclude 'META-INF/proguard/**'
    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
    exclude 'META-INF/LICENSE*', 'META-INF/DEPENDENCIES', 'META-INF/NOTICE*'
    // SQLite now uses GraalPy's native module; do not retain JDBC classes from an old dependency.
    exclude 'org/sqlite/**'
    exclude 'META-INF/versions/*/org/sqlite/**'
    exclude 'META-INF/services/java.sql.Driver'
    exclude '**/*.bat'
    exclude '**/*.exe'
    exclude 'org/slf4j/**'

    zip64 = true
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching('META-INF/services/**') { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
}

jar {
    archiveClassifier = 'dev'
}

if (minecraft_obfuscated) {
    tasks.named('remapJar') {
        dependsOn shadowJar
        inputFile.set(shadowJar.archiveFile)
        archiveClassifier = ''
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    tasks.named('remapSourcesJar') {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

def runtimeJar = minecraft_obfuscated ? tasks.named('remapJar') : tasks.register('runtimeJar', Jar) {
    dependsOn shadowJar, jar
    archiveClassifier = ''
    from({ zipTree(shadowJar.archiveFile.get().asFile) }) { exclude 'fabric.mod.json' }
    // Plain Loom injects the nested-JAR declarations into jar, not shadowJar.
    from({ zipTree(jar.archiveFile.get().asFile) }) { include 'fabric.mod.json', 'META-INF/jars/**' }
    manifest { attributes 'Multi-Release': 'true' }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    zip64 = true
}

def verifyPyFishRuntimeJar = tasks.register('verifyPyFishRuntimeJar') {
    dependsOn runtimeJar
    inputs.file(runtimeJar.flatMap { it.archiveFile })

    doLast {
        def jarFile = runtimeJar.get().archiveFile.get().asFile
        def requiredEntries = [
                'pyfish.py',
                'pyfish-build.properties',
                'java_multiprocessing.py',
                'java_pillow.py',
                'java_websocket.py',
                'python/native_dependencies.py',
                'pip.whl'
        ]
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            def missingEntries = requiredEntries.findAll { entryName -> zip.getEntry(entryName) == null }
            if (!missingEntries.isEmpty()) {
                throw new GradleException("PyFish Fabric jar is missing runtime entries: ${missingEntries.join(', ')}")
            }
            def manifestEntry = zip.getEntry('META-INF/MANIFEST.MF')
            def manifest = manifestEntry != null
                    ? new java.util.jar.Manifest(zip.getInputStream(manifestEntry))
                    : null
            if (!manifest?.mainAttributes?.getValue('Multi-Release')?.equalsIgnoreCase('true')) {
                throw new GradleException('PyFish Fabric jar must preserve Multi-Release: true.')
            }

            def entries = java.util.Collections.list(zip.entries())
            if (entries.any { entry -> entry.name.contains('__pycache__/')
                    || entry.name.endsWith('.pyc') || entry.name.endsWith('.pyo') }) {
                throw new GradleException('PyFish release jar contains local Python bytecode caches.')
            }
            if (entries.any { entry -> entry.name.startsWith('fr/oesphy/pyfish/gametest/')
                    || entry.name.startsWith('data/pyfish_ore_tests/')
                    || entry.name.startsWith('pyfish/pyfish_ore_tests/') }) {
                throw new GradleException('PyFish release jar contains GameTest code or fixtures.')
            }
            if (entries.any { entry ->
                entry.name.endsWith('.class')
                        && (entry.name.startsWith('org/sqlite/')
                        || entry.name.matches('META-INF/versions/\\d+/org/sqlite/.*'))
            }) {
                throw new GradleException('PyFish Fabric jar exposes SQLite classes from its main module.')
            }
            def nestedSqlite = entries.find { entry ->
                entry.name.startsWith('META-INF/jars/')
                        && entry.name.contains('sqlite-jdbc')
                        && entry.name.endsWith('.jar')
            }
            if (nestedSqlite != null) {
                throw new GradleException('PyFish Fabric jar still contains the obsolete SQLite JDBC driver.')
            }
        } finally {
            zip.close()
        }
    }
}

def smokeTestPyFishRuntimeJar = tasks.register('smokeTestPyFishRuntimeJar', JavaExec) {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(java_version)
    }
    dependsOn verifyPyFishRuntimeJar, project(':common').tasks.named('testClasses')
    mainClass = 'fr.oesphy.pyfish.runtime.GraalPyRuntimeJarSmokeTest'
    classpath = files(project(':common').sourceSets.test.output, runtimeJar.flatMap { it.archiveFile })
    environment 'PIP_GRAALPY_PATCHES_URL', 'disabled'
    doFirst {
        delete(layout.buildDirectory.dir('tmp/graalpy-runtime-smoke'))
        args runtimeJar.get().archiveFile.get().asFile.absolutePath,
                layout.buildDirectory.dir('tmp/graalpy-runtime-smoke').get().asFile.absolutePath
    }
}

build.dependsOn smokeTestPyFishRuntimeJar

build.dependsOn runtimeJar, verifyPyFishRuntimeJar
