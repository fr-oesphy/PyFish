name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: mc1211
            java: '21'
          - profile: mc12111
            java: '21'
          - profile: mc262
            java: '25'
    name: Verify ${{ matrix.profile }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run quick verification
        run: ./gradlew -PpyfishVersionProfile=${{ matrix.profile }} quickCheck --stacktrace
